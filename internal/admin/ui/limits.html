<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><title>parsec admin — limits</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
<h1>parsec admin — rate limits</h1>
<nav>
<a href="index.html">Home</a>
<a href="channels.html">Channels</a>
<a href="keys.html">Keys</a>
<a href="dlq.html">DLQ</a>
<a href="limits.html">Limits</a>
<a href="#" class="signout">sign out</a>
</nav>
</header>
<main>
<p class="muted">Read-only view of the configured per-bucket budgets.</p>
<table id="t"><thead><tr><th>bucket</th><th>rate</th><th>per</th><th>burst</th></tr></thead><tbody></tbody></table>
<div class="err" id="err"></div>
</main>
<script type="module">
import { requireToken, parsecCall, mountNav, showError } from "./app.js";
if (requireToken()) {
mountNav();
const err = document.getElementById("err");
const tbody = document.querySelector("#t tbody");
function row(name, lim) {
  lim = lim || {};
  const tr = document.createElement("tr");
  tr.innerHTML = "<td>" + name + "</td><td>" + (lim.Rate || lim.rate || 0) + "</td><td>" + (lim.Per || lim.per || "") + "</td><td>" + (lim.Burst || lim.burst || 0) + "</td>";
  return tr;
}
parsecCall("Manifest", {}).then(r => {
  let m = {};
  try { m = JSON.parse(atob(r.payload || "")); } catch (_) {}
  const rl = (m.payload && m.payload.rate_limits) || {};
  tbody.appendChild(row("publish", rl.publish || rl.Publish));
  tbody.appendChild(row("subscribe", rl.subscribe || rl.Subscribe));
  tbody.appendChild(row("token_issue", rl.token_issue || rl.TokenIssue));
}).catch(e => showError(err, e));
}
</script>
</body>
</html>

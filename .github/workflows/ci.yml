name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.26"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Test (race + integration)
        run: make test-integration

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Lint
        run: make lint

  # The committed go.work makes `make build` / `make test` resolve the
  # nested modules against the working tree, which is what you want while
  # developing them alongside the root module. It also hides a stale or
  # broken pin: a consumer ignores the workspace and resolves the version
  # in stores/*/go.mod. This job is the other half — GOWORK=off builds and
  # tests each nested module against the version it actually pins, and
  # fails on a replace directive, which a consumer would ignore and which
  # makes a tagged nested module ungettable.
  submodule-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Build and test each nested module against its pinned parsec
        env:
          GOWORK: "off"
        run: |
          for m in stores/gcpsecretmanager; do
            echo "==> $m"
            if grep -qE '^[[:space:]]*replace[[:space:]]+github.com/frankbardon/parsec' "$m/go.mod"; then
              echo "$m/go.mod carries a replace for parsec; consumers ignore it" >&2
              exit 1
            fi
            (cd "$m" && go build ./... && go test ./...) || exit 1
          done

  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/js
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: clients/js/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Build with `make build`
        2. Run `bin/parsec <command> ...`
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include error messages, JSON envelope output, or logs if available.
    validations:
      required: true

  - type: textarea
    id: channel
    attributes:
      label: Channel
      description: Channel name involved (e.g. `public:webapp.user.notifications`). Redact private secrets.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Library facade (parsec.go)
        - CLI (cmd/parsec)
        - Broker (centrifuge wrapper)
        - Channels (public / private / TTL)
        - Sinks (email / slack / webhook)
        - Twirp surface
        - Descriptor (manifest)
        - Errors / Codes
        - Other

  - type: input
    id: go-version
    attributes:
      label: Go Version
      placeholder: "1.26"

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "macOS 14.5 / Ubuntu 24.04 / Windows 11"

# Parsec config for the bundled docker-compose stack. Mounted at
# /etc/parsec/parsec.yaml inside the container.

server:
  addr: ":8000"

auth:
  # No state_dir: redis wins the keyring precedence, so keyring.json would
  # never be read or written. Redis holds the signing keys — see the
  # durability requirements in docs/src/ops/deployment.md.
  mgmt_subject: operator
  mgmt_ttl: 24h
  # Also the interval between redis reconcile reads that catch a rotation
  # event this node missed.
  keyring_poll: 5s

redis:
  addr: redis://redis:6379
  key_prefix: parsec
  # Credentials may ride in addr (redis://user:pass@host:port/db) or be set
  # here; these win over the URL. Use rediss:// or tls.enabled for TLS.
  # username: parsec
  # password: ${REDIS_PASSWORD}
  # tls:
  #   enabled: true
  #   ca_file: /etc/parsec/redis-ca.pem

manager:
  sweep_interval: 30s

sink_retry:
  max_attempts: 5
  base_backoff: 1s
  max_backoff: 30s

rate_limits:
  publish:     { rate: 100, per: 1s, burst: 30 }
  subscribe:   { rate: 20,  per: 1s, burst: 10 }
  token_issue: { rate: 5,   per: 1s }
